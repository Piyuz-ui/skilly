<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08060b" />
    <meta name="description" content="Skilly — take a language skills assessment, get an honest report and a weekly learning roadmap." />
    <title>Skilly — skill assessment & learning paths</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Skilly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms detects this hidden form at deploy time; the React
         feedback dialog (src/components/Feedback.jsx) posts to it. -->
    <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="rating" /><textarea name="message"></textarea><input name="email" />
      <input name="page" /><input name="journey" /><input name="device" /><input name="bot-field" />
    </form>
    <form name="question-report" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="question" /><input name="language" /><input name="issue" /><textarea name="note"></textarea><input name="bot-field" />
    </form>
    <!-- New accounts and sign-ins (src/lib/notify.js); Netlify emails the team. -->
    <form name="account-event" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="event" /><input name="method" /><input name="name" /><input name="email" />
      <input name="phone" /><input name="uid" /><input name="device" /><input name="bot-field" />
    </form>
    <noscript>Skilly needs JavaScript to run assessments.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
